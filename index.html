            display: flex;
            justify-content: center;
            align-items: center;

        }

        .card {

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 8px 0;
        }

        .email {
            margin-top: 20px;
            padding: 10px;
            background: #f0f4ff;
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>

    <div class="card">

</html>
